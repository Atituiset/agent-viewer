name: CI

on:
  push:
    branches: [main, master, "feat/**", "dev"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 需要与 Electron ABI 匹配的原生构建；
      # 这里验证 rebuild 在三个平台都能通过。注意顺序：
      # 先用当前 Node ABI 跑单测，再 rebuild 成 Electron ABI，
      # 否则 vitest 加载 better_sqlite3.node 会报 NODE_MODULE_VERSION 不匹配。
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Rebuild native modules (Electron ABI)
        run: npm run rebuild
        env:
          # 跳过下载 Electron 二进制，只做头文件编译，快很多
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Typecheck & build Electron main
        run: npm run build:electron

      - name: Build Next.js renderer
        run: npm run build

      # 冒烟：打包前验证主进程 bundle（含 better-sqlite3 原生绑定）能真正启动。
      # Linux 无显示环境，用 xvfb 包一层；Win/macOS runner 自带图形会话。
      - name: Smoke test — app launches (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.js

      - name: Smoke test — app launches (Windows/macOS)
        if: runner.os != 'Linux'
        run: node scripts/smoke.js
